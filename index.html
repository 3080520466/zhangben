<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的账本">
<meta name="theme-color" content="#4F6EF7">

<style>
  :root {
    --pri: #4F6EF7; --pri-light: #EEF1FE;
    --green: #34C759; --green-bg: #EDF9F0;
    --red: #FF3B30; --red-bg: #FFF0EF;
    --bg: #F2F3F7; --card: #FFFFFF;
    --text: #1C1E23; --sub: #8E92A0;
    --border: #EAECF0;
    --radius: 14px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 3px 10px rgba(0,0,0,0.04);
    --nav-h: 64px; --safe-b: env(safe-area-inset-bottom, 12px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: -webkit-fill-available;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(var(--nav-h) + var(--safe-b));
    user-select: none; -webkit-user-select: none;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 14px; }

  /* 顶部 */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 4px; }
  .topbar h1 { font-size: 22px; font-weight: 700; }
  .topbar .today { font-size: 12px; color: var(--sub); background: var(--card); padding: 4px 10px; border-radius: 10px; }

  /* 月份 */
  .month-bar { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 4px 0 10px; }
  .month-bar .mbtn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--card);
    font-size: 13px; cursor: pointer; color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .month-bar .mbtn:active { background: var(--pri-light); border-color: var(--pri); }
  .month-bar .mlabel { font-size: 17px; font-weight: 600; }

  /* 汇总 */
  .summary-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .sum-item {
    flex: 1; background: var(--card); border-radius: var(--radius);
    padding: 13px 10px; box-shadow: var(--shadow-sm); text-align: center;
  }
  .sum-item .slabel { font-size: 11px; color: var(--sub); margin-bottom: 4px; letter-spacing: 0.5px; }
  .sum-item .sval { font-size: 19px; font-weight: 700; transition: color 0.3s; }
  .sum-item.inc .sval { color: var(--green); }
  .sum-item.exp .sval { color: var(--red); }
  .sum-item.bal .sval { color: var(--pri); }

  /* 预算 */
  .budget-bar {
    background: var(--card); border-radius: var(--radius);
    padding: 11px 14px; box-shadow: var(--shadow-sm); margin-bottom: 8px;
  }
  .budget-bar .bhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .budget-bar .btitle { font-size: 13px; font-weight: 600; }
  .budget-bar .br { display: flex; gap: 4px; align-items: center; }
  .budget-bar .br input {
    width: 68px; padding: 4px 6px; border-radius: 6px;
    border: 1.5px solid var(--border); font-size: 12px; text-align: center;
    font-family: inherit; outline: none;
  }
  .budget-bar .br input:focus { border-color: var(--pri); }
  .budget-bar .br .bset {
    padding: 4px 10px; border-radius: 6px; border: none;
    background: var(--pri); color: #fff; font-size: 11px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btrack { width: 100%; height: 5px; background: #F2F3F7; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .bfill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .bnote { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }

  /* Tab */
  .tab-content { display: none; animation: fadeTab 0.2s; }
  .tab-content.active { display: block; }
  @keyframes fadeTab { from { opacity: 0.7; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* 表单 */
  .form-card { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-sm); margin-bottom: 8px; }
  .type-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .type-row button {
    flex: 1; padding: 9px; border-radius: var(--radius-sm);
    border: 2px solid var(--border); background: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .type-row button.eact { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .type-row button.iact { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .form-card .fr { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-card .fr:last-of-type { margin-bottom: 10px; }
  .form-card input, .form-card select {
    padding: 10px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    font-size: 15px; outline: none; font-family: inherit;
    background: #F9FAFB; color: var(--text);
    transition: border-color 0.15s; -webkit-appearance: none;
  }
  .form-card input:focus, .form-card select:focus { border-color: var(--pri); box-shadow: 0 0 0 2px rgba(79,110,247,0.08); }
  .form-card .amt { font-size: 26px; font-weight: 700; text-align: center; }
  .form-card .fcat, .form-card .fdate, .form-card .fnote { flex: 1; min-width: 0; }
  .form-card .add-btn {
    width: 100%; padding: 12px; border-radius: var(--radius-sm); border: none;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    color: #fff; transition: all 0.15s;
  }
  .form-card .add-btn:active { transform: scale(0.97); }

  /* 快速模板 */
  .tpl-section { margin-bottom: 6px; }
  .tpl-section .tlabel { font-size: 12px; color: var(--sub); margin-bottom: 6px; padding-left: 2px; }
  .tpl-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .tpl-chip {
    padding: 7px 13px; border-radius: 18px; border: 1.5px solid var(--border);
    background: var(--card); font-size: 12px; cursor: pointer;
    transition: all 0.15s; font-family: inherit; color: var(--text); white-space: nowrap;
  }
  .tpl-chip:active { transform: scale(0.95); }
  .tpl-chip.e { border-color: #FFD5D0; }
  .tpl-chip.e:active { background: var(--red-bg); }
  .tpl-chip.i { border-color: #C2EFCC; }
  .tpl-chip.i:active { background: var(--green-bg); }

  /* 明细列表 */
  .rec-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 8px; }
  .rec-card .rhead { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .rec-card .rhead .rt { font-size: 14px; font-weight: 600; }
  .rec-card .rhead .rc { font-size: 11px; color: var(--sub); }
  .rec-card .search {
    margin: 8px 12px; padding: 9px 12px; width: calc(100% - 24px);
    border-radius: 8px; border: 1.5px solid var(--border);
    font-size: 14px; outline: none; font-family: inherit; background: #F9FAFB;
  }
  .rec-card .search:focus { border-color: var(--pri); }

  /* 日期分组 */
  .day-group { }
  .day-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #F9FAFB; border-bottom: 1px solid #F5F5F5;
    position: sticky; top: 0; z-index: 2;
  }
  .day-header .dlabel { font-size: 13px; font-weight: 600; color: var(--text); }
  .day-header .dsum { font-size: 12px; color: var(--sub); }
  .day-header .dsum span { font-weight: 600; }
  .day-header .dsum span.ex { color: var(--red); }
  .day-header .dsum span.in { color: var(--green); }

  /* 记录项 */
  .rec-row { position: relative; overflow: hidden; }
  .rec-item {
    display: flex; align-items: center; padding: 12px 14px;
    border-bottom: 1px solid #F5F5F5; cursor: pointer;
    transition: transform 0.2s, background 0.1s;
    position: relative; z-index: 1; background: var(--card);
  }
  .rec-item.swiped { transform: translateX(-120px); }
  .rec-item:active { background: #F9FAFB; }
  .rec-row:last-child .rec-item { border-bottom: none; }
  .rec-actions {
    position: absolute; right: 0; top: 0; bottom: 0;
    display: flex; z-index: 0;
  }
  .rec-actions button {
    width: 60px; border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; color: #fff;
  }
  .rec-actions .act-edit { background: var(--pri); }
  .rec-actions .act-del { background: var(--red); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

  .ricon {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0; margin-right: 10px;
  }
  .ricon.e { background: var(--red-bg); }
  .ricon.i { background: var(--green-bg); }
  .rinfo { flex: 1; min-width: 0; }
  .rinfo .cat { font-size: 14px; font-weight: 500; }
  .rinfo .meta { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .rinfo .meta span { margin-right: 8px; }
  .ramt { font-size: 16px; font-weight: 700; margin-right: 6px; flex-shrink: 0; }
  .ramt.e { color: var(--red); }
  .ramt.i { color: var(--green); }
  .rdot {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: transparent; color: #ccc; font-size: 16px; cursor: pointer;
    flex-shrink: 0; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .rdot:active { background: var(--red-bg); color: var(--red); }

  .empty { text-align: center; padding: 40px 16px; color: var(--sub); }
  .empty .eicon { font-size: 40px; margin-bottom: 6px; }

  /* 统计 */
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); margin-bottom: 8px; display: flex; flex-direction: column; align-items: center; }
  .stat-card canvas { max-width: 190px; max-height: 190px; }
  .stat-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; justify-content: center; font-size: 11px; color: var(--sub); }
  .stat-legend span { display: flex; align-items: center; gap: 3px; }
  .stat-legend .dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .stat-compare { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-sm); margin-bottom: 8px; }
  .stat-compare .sct { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .stat-compare .scr { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 14px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .tag.up { background: var(--red-bg); color: var(--red); }
  .tag.down { background: var(--green-bg); color: var(--green); }
  .tag.flat { background: #F2F3F7; color: #8E92A0; }

  /* 设置 */
  .set-section { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 8px; }
  .set-section .stitle { padding: 12px 14px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .stitle .sadd { font-size: 20px; color: var(--pri); cursor: pointer; line-height: 1; width: 28px; text-align: center; }
  .set-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #F5F5F5; font-size: 14px; cursor: pointer; }
  .set-row:active { background: #F9FAFB; }
  .set-row:last-child { border-bottom: none; }
  .set-row .sarr { color: #ccc; }
  .set-row .danger { color: var(--red); }
  .cat-tag { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .cat-tag .cdel { color: #ccc; font-size: 16px; cursor: pointer; padding: 2px; }
  .cat-tag .cdel:active { color: var(--red); }

  /* 弹窗 */
  .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: 99; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet { background: #fff; border-radius: 18px 18px 0 0; padding: 18px 14px calc(18px + var(--safe-b)); width: 100%; max-width: 480px; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet h3 { font-size: 16px; margin-bottom: 12px; text-align: center; }
  .sheet .fr { display: flex; gap: 8px; margin-bottom: 8px; }
  .sheet input, .sheet select { flex: 1; padding: 10px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 15px; outline: none; font-family: inherit; background: #F9FAFB; }
  .sheet input:focus, .sheet select:focus { border-color: var(--pri); }
  .sheet .emoji-pick { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .sheet .emoji-pick button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; background: #F9FAFB; font-size: 16px; cursor: pointer; }
  .sheet .emoji-pick button.sel { border-color: var(--pri); background: var(--pri-light); }
  .sheet-btns { display: flex; gap: 8px; margin-top: 10px; }
  .sheet-btns button { flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .sheet-btns .sbtn-pri { background: var(--pri); color: #fff; }
  .sheet-btns .sbtn-ghost { background: #F2F3F7; color: var(--sub); }
  .sheet-btns .sbtn-danger { background: var(--red-bg); color: var(--red); }

  /* Toast */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 22px; border-radius: 18px; background: #1C1E23; color: #fff; font-size: 13px; font-weight: 500; z-index: 999; animation: toastIn 0.3s; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* 底部导航 */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; z-index: 50; padding-bottom: var(--safe-b); max-width: 480px; margin: 0 auto; }
  .bottom-nav .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 7px 0 3px; cursor: pointer; gap: 1px; -webkit-tap-highlight-color: transparent; }
  .bottom-nav .nav-item .ni { font-size: 21px; line-height: 1; transition: transform 0.15s; }
  .bottom-nav .nav-item .nt { font-size: 10px; color: var(--sub); font-weight: 500; transition: color 0.15s; }
  .bottom-nav .nav-item.active .nt { color: var(--pri); }
  .bottom-nav .nav-item:active .ni { transform: scale(0.85); }

  @media (min-width: 480px) { body { padding-top: 8px; } .bottom-nav { border-radius: 14px 14px 0 0; left: auto; right: auto; } }
  @media (max-width: 360px) {
    .summary-row { gap: 5px; } .sum-item { padding: 10px 6px; } .sum-item .sval { font-size: 17px; }
    .tpl-chips { gap: 4px; } .tpl-chip { padding: 5px 8px; font-size: 11px; }
    .rec-item { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <h1>📒 我的账本</h1>
    <span class="today" id="todayStr"></span>
  </div>

  <div class="month-bar">
    <button class="mbtn" onclick="prevMonth()">◀</button>
    <span class="mlabel" id="monthLabel">2026年5月</span>
    <button class="mbtn" onclick="nextMonth()">▶</button>
  </div>

  <div class="summary-row">
    <div class="sum-item inc"><div class="slabel">收入</div><div class="sval" id="sInc">¥0</div></div>
    <div class="sum-item exp"><div class="slabel">支出</div><div class="sval" id="sExp">¥0</div></div>
    <div class="sum-item bal"><div class="slabel">结余</div><div class="sval" id="sBal">¥0</div></div>
  </div>

  <div class="budget-bar">
    <div class="bhead">
      <span class="btitle">🎯 月度预算</span>
      <div class="br">
        <input id="budgetInput" type="number" placeholder="预算" inputmode="numeric" onkeydown="if(event.key==='Enter')setBudget()">
        <button class="bset" onclick="setBudget()">设置</button>
      </div>
    </div>
    <div class="btrack"><div class="bfill" id="bfill" style="width:0%"></div></div>
    <div class="bnote"><span id="bUsed">已用 ¥0</span><span id="bRemain">未设置预算</span></div>
  </div>

  <!-- Tab 1: 记账 -->
  <div class="tab-content active" id="tabAdd">
    <div class="form-card">
      <div class="type-row">
        <button class="eact" id="btnExp" onclick="setType('expense')">🔴 支出</button>
        <button id="btnInc" onclick="setType('income')">🟢 收入</button>
      </div>
      <div class="fr"><input class="amt" id="amt" type="number" placeholder="0.00" step="0.01" min="0.01" inputmode="decimal" onkeydown="if(event.key==='Enter')addRecord()"></div>
      <div class="fr">
        <select class="fcat" id="fcat"></select>
        <input class="fdate" id="fdate" type="date">
      </div>
      <div class="fr"><input class="fnote" id="fnote" type="text" placeholder="添加备注..."></div>
      <button class="add-btn" id="addBtn" onclick="addRecord()">记一笔</button>
    </div>

    <div class="tpl-section">
      <div class="tlabel">⚡ 快速记录</div>
      <div class="tpl-chips">
        <button class="tpl-chip e" onclick="quickAdd('expense','🍜 餐饮',25,'午餐')">🍱 午餐 25</button>
        <button class="tpl-chip e" onclick="quickAdd('expense','🍜 餐饮',15,'早餐')">🥛 早餐 15</button>
        <button class="tpl-chip e" onclick="quickAdd('expense','🍜 餐饮',35,'晚餐')">🍲 晚餐 35</button>
        <button class="tpl-chip e" onclick="quickAdd('expense','🚌 交通',8,'通勤')">🚇 通勤 8</button>
        <button class="tpl-chip e" onclick="quickAdd('expense','📱 通讯',50,'话费')">📱 话费 50</button>
        <button class="tpl-chip e" onclick="quickAdd('expense','🛒 购物',50,'日用品')">🛍️ 购物 50</button>
        <button class="tpl-chip i" onclick="quickAdd('income','💰 工资',8000,'月薪')">💵 工资</button>
        <button class="tpl-chip i" onclick="quickAdd('income','🧧 红包',200,'零花')">🧧 红包</button>
      </div>
    </div>
  </div>

  <!-- Tab 2: 明细 -->
  <div class="tab-content" id="tabList">
    <div class="rec-card">
      <div class="rhead"><span class="rt">📋 收支明细</span><span class="rc" id="recCount">0 条</span></div>
      <input class="search" id="search" type="text" placeholder="🔍 搜索..." oninput="renderRecords()">
      <div id="recList"><div class="empty"><div class="eicon">📭</div><div>暂无记录</div></div></div>
    </div>
  </div>

  <!-- Tab 3: 统计 -->
  <div class="tab-content" id="tabStats">
    <div class="stat-card">
      <canvas id="pieCanvas" width="280" height="280"></canvas>
      <div class="stat-legend" id="pieLegend"></div>
    </div>
    <div class="stat-compare">
      <div class="sct">📊 较上月对比</div>
      <div class="scr"><span>收入</span><span id="cmpInc">--</span></div>
      <div class="scr"><span>支出</span><span id="cmpExp">--</span></div>
    </div>
  </div>

  <!-- Tab 4: 我的 -->
  <div class="tab-content" id="tabMe">
    <div class="set-section">
      <div class="stitle"><span>🏷️ 分类管理</span><span class="sadd" onclick="addCategory()">+</span></div>
      <div id="catList"></div>
    </div>
    <div class="set-section">
      <div class="stitle">💾 数据管理</div>
      <div class="set-row" onclick="exportCSV()"><span>📥 导出 CSV</span><span class="sarr">›</span></div>
      <div class="set-row" onclick="exportJSON()"><span>💾 备份 JSON</span><span class="sarr">›</span></div>
      <div class="set-row" onclick="document.getElementById('importFile').click()"><span>📤 导入备份</span><span class="sarr">›</span></div>
      <div class="set-row" onclick="clearAll()"><span class="danger">🗑️ 清空数据</span><span class="sarr">›</span></div>
    </div>
    <div style="text-align:center;color:var(--sub);font-size:11px;padding:6px;">数据存于浏览器 · 建议定期备份</div>
  </div>

  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
</div>

<!-- 编辑记录弹窗 -->
<div class="overlay" id="editModal" style="display:none" onclick="if(event.target===this)closeEdit()">
  <div class="sheet">
    <h3>✏️ 编辑记录</h3>
    <div class="fr"><select id="eCat"></select></div>
    <div class="fr"><input id="eAmt" type="number" placeholder="金额" step="0.01" inputmode="decimal"><input id="eDate" type="date"></div>
    <div class="fr"><input id="eNote" type="text" placeholder="备注"></div>
    <div class="sheet-btns">
      <button class="sbtn-danger" onclick="deleteEdit()">删除</button>
      <button class="sbtn-ghost" onclick="closeEdit()">取消</button>
      <button class="sbtn-pri" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 添加分类弹窗 -->
<div class="overlay" id="catModal" style="display:none" onclick="if(event.target===this)closeCatModal()">
  <div class="sheet">
    <h3 id="catModalTitle">🏷️ 添加分类</h3>
    <div class="emoji-pick" id="emojiPick"></div>
    <div class="fr"><input id="catName" type="text" placeholder="分类名称"></div>
    <div class="fr"><select id="catType"><option value="expense">支出</option><option value="income">收入</option></select></div>
    <div class="sheet-btns">
      <button class="sbtn-ghost" onclick="closeCatModal()">取消</button>
      <button class="sbtn-pri" onclick="saveCat()">保存</button>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <div class="nav-item active" data-tab="tabAdd" onclick="switchTab('tabAdd')"><div class="ni">✏️</div><div class="nt">记账</div></div>
  <div class="nav-item" data-tab="tabList" onclick="switchTab('tabList')"><div class="ni">📋</div><div class="nt">明细</div></div>
  <div class="nav-item" data-tab="tabStats" onclick="switchTab('tabStats')"><div class="ni">📊</div><div class="nt">统计</div></div>
  <div class="nav-item" data-tab="tabMe" onclick="switchTab('tabMe')"><div class="ni">⚙️</div><div class="nt">我的</div></div>
</nav>

<script>
// ===== 数据层 =====
const SK = 'zb2_data', BK = 'zb2_budget', CK = 'zb2_cats';
let records = [], budget = 0, ctype = 'expense', cmonth = '', editingId = null, catEditId = null;
let curEmoji = '📦';

const defaultCats = {
  income: ['💰 工资','🧧 红包','📈 理财','💼 兼职','🎁 礼金','↩️ 退款'],
  expense: ['🍜 餐饮','🚌 交通','🛒 购物','🏠 房租','💡 水电','📱 通讯','🎮 娱乐','💊 医疗','👔 服饰','💄 美妆','🎁 礼物']
};
let cats = { income: [...defaultCats.income], expense: [...defaultCats.expense] };
const EMOJIS = ['💰','🧧','📈','💼','🎁','↩️','🍜','🚌','🛒','🏠','💡','📱','🎮','💊','👔','💄','🎁','📦','☕','🍕','🚗','🏥','📚','💻','🐱','✈️','💇','🎬','🎵','🏋️'];

function sm() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
cmonth = sm();

function load() {
  try { records = JSON.parse(localStorage.getItem(SK)) || []; } catch(e) { records = []; }
  records.sort((a,b) => new Date(b.date) - new Date(a.date));
  try { const d=JSON.parse(localStorage.getItem(BK))||{}; budget=d[cmonth]||0; } catch(e) { budget=0; }
  document.getElementById('budgetInput').value = budget||'';
  // 加载自定义分类
  try { const saved=JSON.parse(localStorage.getItem(CK)); if(saved) cats=saved; } catch(e) {}
}
function save() { localStorage.setItem(SK, JSON.stringify(records)); }
function saveBudget() { let d={}; try { d=JSON.parse(localStorage.getItem(BK))||{}; } catch(e) {} d[cmonth]=budget; localStorage.setItem(BK, JSON.stringify(d)); }
function saveCats() { localStorage.setItem(CK, JSON.stringify(cats)); updateCatSelect(); renderCatList(); }

// ===== 月份 =====
function prevMonth() { const [y,m]=cmonth.split('-').map(Number); const d=new Date(y,m-2,1); cmonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); lbm(); refresh(); }
function nextMonth() { const [y,m]=cmonth.split('-').map(Number); const d=new Date(y,m,1); cmonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); lbm(); refresh(); }
function lbm() { try { const d=JSON.parse(localStorage.getItem(BK))||{}; budget=d[cmonth]||0; } catch(e){budget=0;} document.getElementById('budgetInput').value=budget||''; }

// ===== Tab =====
function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
  if (tabId === 'tabStats') { renderPie(); renderCompare(); }
  if (tabId === 'tabList') renderRecords();
  if (tabId === 'tabMe') renderCatList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // 重置所有滑动
  document.querySelectorAll('.rec-item.swiped').forEach(el => el.classList.remove('swiped'));
}

// ===== 类型 =====
function setType(t) {
  ctype = t;
  document.getElementById('btnExp').className = t==='expense'?'eact':'';
  document.getElementById('btnInc').className = t==='income'?'iact':'';
  const btn = document.getElementById('addBtn');
  btn.style.background = t==='expense'?'var(--red)':'var(--green)';
  btn.textContent = t==='expense'?'记一笔支出':'记一笔收入';
  updateCatSelect();
}
function updateCatSelect() {
  const s = document.getElementById('fcat');
  s.innerHTML = cats[ctype].map(c => `<option value="${c}">${c}</option>`).join('');
}

// ===== 快速模板 =====
function quickAdd(type, cat, amt, note) {
  setType(type);
  document.getElementById('amt').value = amt;
  document.getElementById('fcat').value = cat;
  document.getElementById('fnote').value = note||'';
  document.getElementById('amt').focus();
  toast('已填充，点击按钮确认 ✓');
}

// ===== 添加记录 =====
function addRecord() {
  const amt = parseFloat(document.getElementById('amt').value);
  if (!amt || amt <= 0) { toast('请输入有效金额'); return; }
  records.unshift({
    id: Date.now(), type: ctype,
    amount: Math.round(amt*100)/100,
    category: document.getElementById('fcat').value,
    date: document.getElementById('fdate').value,
    note: document.getElementById('fnote').value.trim()
  });
  save();
  document.getElementById('amt').value = '';
  document.getElementById('fnote').value = '';
  document.getElementById('amt').focus();
  refresh(); toast('已记录 ✓');
}

// ===== 删除 =====
function deleteRecord(id) {
  if (!confirm('删除这条记录？')) return;
  records = records.filter(r => r.id !== id);
  save(); refresh(); toast('已删除');
}
function clearAll() {
  if (!confirm('确定清空全部数据？')) return;
  if (!confirm('再次确认？')) return;
  records = []; save(); refresh(); toast('已清空');
}

// ===== 编辑弹窗 =====
function openEdit(id) {
  const r = records.find(r => r.id === id);
  if (!r) return;
  editingId = id;
  const s = document.getElementById('eCat');
  s.innerHTML = cats[r.type].map(c => `<option value="${c}" ${c===r.category?'selected':''}>${c}</option>`).join('');
  document.getElementById('eAmt').value = r.amount;
  document.getElementById('eDate').value = r.date;
  document.getElementById('eNote').value = r.note;
  document.getElementById('editModal').style.display = 'flex';
  // 重置滑动
  document.querySelectorAll('.rec-item.swiped').forEach(el => el.classList.remove('swiped'));
}
function closeEdit() { document.getElementById('editModal').style.display='none'; editingId=null; }
function saveEdit() {
  if (editingId===null) return;
  const r = records.find(r => r.id===editingId);
  if (!r) return;
  const amt = parseFloat(document.getElementById('eAmt').value);
  if (!amt||amt<=0) { toast('请输入有效金额'); return; }
  r.category = document.getElementById('eCat').value;
  r.amount = Math.round(amt*100)/100;
  r.date = document.getElementById('eDate').value;
  r.note = document.getElementById('eNote').value.trim();
  save(); closeEdit(); refresh(); toast('已保存 ✓');
}
function deleteEdit() {
  if (editingId===null) return;
  if (!confirm('确定删除？')) return;
  records = records.filter(r => r.id!==editingId);
  save(); closeEdit(); refresh(); toast('已删除');
}

// ===== 预算 =====
function setBudget() {
  const v = parseFloat(document.getElementById('budgetInput').value);
  if (!v || v<=0) { toast('请输入预算金额'); return; }
  budget = v; saveBudget(); updateBudget(); toast('预算已设置 ✓');
}
function updateBudget() {
  const bar = document.getElementById('bfill');
  const me = records.filter(r => r.date.startsWith(cmonth) && r.type==='expense').reduce((s,r)=>s+r.amount,0);
  document.getElementById('bUsed').textContent = '已用 ¥'+me.toFixed(0);
  if (!budget) { bar.style.width='0%'; bar.style.background=''; document.getElementById('bRemain').textContent='未设置预算'; return; }
  const pct = Math.min(100, Math.round(me/budget*100));
  bar.style.width = pct+'%';
  bar.style.background = pct<50?'linear-gradient(90deg,#34C759,#28A745)':pct<80?'linear-gradient(90deg,#FFCC00,#FF9500)':'linear-gradient(90deg,#FF3B30,#D63031)';
  const rem = budget - me;
  const re = document.getElementById('bRemain');
  re.textContent = rem>=0?'剩余 ¥'+rem.toFixed(0):'超支 ¥'+Math.abs(rem).toFixed(0);
  re.style.color = rem<0?'var(--red)':'';
}

// ===== 汇总 =====
function renderSummary() {
  const mr = records.filter(r => r.date.startsWith(cmonth));
  let inc=0, exp=0;
  mr.forEach(r => { if(r.type==='income') inc+=r.amount; else exp+=r.amount; });
  document.getElementById('sInc').textContent = '¥'+inc.toFixed(2);
  document.getElementById('sExp').textContent = '¥'+exp.toFixed(2);
  const bal = inc - exp;
  const bel = document.getElementById('sBal');
  bel.textContent = '¥'+bal.toFixed(2);
  bel.style.color = bal>=0?'var(--pri)':'var(--red)';
  document.getElementById('monthLabel').textContent = cmonth.replace('-','年')+'月';
}

// ===== 记录列表 (按日期分组) =====
function renderRecords() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const mr = records.filter(r => r.date.startsWith(cmonth));
  const filtered = kw ? mr.filter(r => r.note.toLowerCase().includes(kw)||r.category.includes(kw)) : mr;
  document.getElementById('recCount').textContent = mr.length+' 条';
  const c = document.getElementById('recList');

  if (filtered.length === 0) {
    c.innerHTML = `<div class="empty"><div class="eicon">${kw?'🔍':'📭'}</div><div>${kw?'无匹配记录':'暂无记录'}</div></div>`;
    return;
  }

  // 按日期分组
  const todayStr = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.date]) groups[r.date] = [];
    groups[r.date].push(r);
  });

  function dateLabel(d) {
    if (d === todayStr) return '今天';
    if (d === yesterday) return '昨天';
    const dt = new Date(d + 'T00:00:00');
    const w = ['日','一','二','三','四','五','六'][dt.getDay()];
    return (dt.getMonth()+1)+'/'+dt.getDate()+' 周'+w;
  }

  let html = '';
  Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(date => {
    const items = groups[date];
    let dayExp = 0, dayInc = 0;
    items.forEach(r => { if(r.type==='expense') dayExp+=r.amount; else dayInc+=r.amount; });

    let sumHtml = '';
    if (dayExp > 0 && dayInc > 0) sumHtml = `支出 <span class="ex">¥${dayExp.toFixed(0)}</span> · 收入 <span class="in">¥${dayInc.toFixed(0)}</span>`;
    else if (dayExp > 0) sumHtml = `支出 <span class="ex">¥${dayExp.toFixed(0)}</span>`;
    else if (dayInc > 0) sumHtml = `收入 <span class="in">¥${dayInc.toFixed(0)}</span>`;

    html += `<div class="day-group"><div class="day-header"><span class="dlabel">${dateLabel(date)}</span><span class="dsum">${sumHtml}</span></div>`;
    items.forEach(r => {
      const isInc = r.type==='income';
      html += `
      <div class="rec-row">
        <div class="rec-item" data-id="${r.id}" ontouchstart="ts(event,${r.id})" ontouchmove="tm(event)" ontouchend="te(event,${r.id})" onclick="openEdit(${r.id})">
          <div class="ricon ${isInc?'i':'e'}">${r.category.slice(0,2)}</div>
          <div class="rinfo">
            <div class="cat">${r.category}</div>
            <div class="meta">${r.note ? `<span>📝 ${esc(r.note)}</span>` : ''}</div>
          </div>
          <div class="ramt ${isInc?'i':'e'}">${isInc?'+':'-'}¥${r.amount.toFixed(2)}</div>
          <div class="rdot" onclick="event.stopPropagation();deleteRecord(${r.id})">⋯</div>
        </div>
        <div class="rec-actions">
          <button class="act-edit" onclick="openEdit(${r.id})">编辑</button>
          <button class="act-del" onclick="deleteRecord(${r.id})">删除</button>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  c.innerHTML = html;
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ===== 滑动操作 =====
let touchStartX = 0, touchStartY = 0, swipedEl = null;
function ts(e, id) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  // 重置其他滑动
  if (swipedEl && swipedEl !== e.currentTarget) {
    swipedEl.classList.remove('swiped');
  }
}
function tm(e) {
  // 不阻止默认，保留滚动
}
function te(e, id) {
  const el = e.currentTarget;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // 横向滑动超过 30px 且大于纵向
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) {
      el.classList.add('swiped');
      swipedEl = el;
    } else {
      el.classList.remove('swiped');
      swipedEl = null;
    }
  }
}

// ===== 饼图 =====
const PCOLORS = ['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#5856D6','#AF52DE','#FF2D55','#5AC8FA','#FF6D3A','#8E8E93','#4CD964'];
function renderPie() {
  const cv = document.getElementById('pieCanvas');
  const ctx = cv.getContext('2d');
  const w=cv.width, h=cv.height; ctx.clearRect(0,0,w,h);
  const mr = records.filter(r=>r.date.startsWith(cmonth)&&r.type==='expense');
  const map={}; let total=0;
  mr.forEach(r=>{ const cat=r.category.replace(/^[^\s]+\s/,''); map[cat]=(map[cat]||0)+r.amount; total+=r.amount; });
  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const leg = document.getElementById('pieLegend');
  if (!entries.length) {
    ctx.fillStyle='#8E92A0'; ctx.font='14px sans-serif'; ctx.textAlign='center';
    ctx.fillText('暂无支出数据', w/2, h/2); leg.innerHTML=''; return;
  }
  const cx=w/2, cy=h/2, r=90; let sa=-Math.PI/2;
  entries.forEach((e,i)=>{
    const slice=e[1]/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,sa,sa+slice); ctx.closePath();
    ctx.fillStyle=PCOLORS[i%PCOLORS.length]; ctx.fill();
    if(slice>0.3){ const ma=sa+slice/2; ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(Math.round(e[1]/total*100)+'%',cx+Math.cos(ma)*r*0.62,cy+Math.sin(ma)*r*0.62); }
    sa+=slice;
  });
  ctx.beginPath(); ctx.arc(cx,cy,38,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  leg.innerHTML = entries.slice(0,6).map((e,i)=>`<span><span class="dot" style="background:${PCOLORS[i]}"></span>${e[0]} ${Math.round(e[1]/total*100)}%</span>`).join('');
}

// ===== 环比 =====
function renderCompare() {
  const [y,m]=cmonth.split('-').map(Number);
  const pm=new Date(y,m-2,1); const prev=pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0');
  function mt(m,t){ return records.filter(r=>r.date.startsWith(m)&&r.type===t).reduce((s,r)=>s+r.amount,0); }
  const ic=mt(cmonth,'income'), ec=mt(cmonth,'expense');
  const ip=mt(prev,'income'), ep=mt(prev,'expense');
  function tag(cur,prev){
    if(prev===0) return '<span class="tag flat">新增</span>';
    const p=Math.round((cur-prev)/prev*100);
    if(p>0) return `<span class="tag up">↑${p}%</span>`;
    if(p<0) return `<span class="tag down">↓${Math.abs(p)}%</span>`;
    return '<span class="tag flat">持平</span>';
  }
  document.getElementById('cmpInc').innerHTML='¥'+ic.toFixed(0)+' '+tag(ic,ip);
  document.getElementById('cmpExp').innerHTML='¥'+ec.toFixed(0)+' '+tag(ec,ep);
}

// ===== 分类管理 =====
function renderCatList() {
  const el = document.getElementById('catList');
  let html = '';
  ['expense','income'].forEach(type => {
    const label = type==='expense'?'🔴 支出':'🟢 收入';
    html += `<div class="set-row" style="font-size:12px;color:var(--sub);font-weight:600;padding:8px 14px;background:#F9FAFB;">${label}</div>`;
    cats[type].forEach((cat, i) => {
      const isDefault = defaultCats[type].includes(cat);
      html += `<div class="set-row">
        <span class="cat-tag">${cat}</span>
        <span>
          <span class="cdel" onclick="editCat('${type}',${i})" title="编辑">✏️</span>
          ${!isDefault ? `<span class="cdel" onclick="deleteCat('${type}',${i})" title="删除">×</span>` : ''}
        </span>
      </div>`;
    });
  });
  el.innerHTML = html;
}

function addCategory() {
  catEditId = null; curEmoji = '📦';
  document.getElementById('catModalTitle').textContent = '🏷️ 添加分类';
  document.getElementById('catName').value = '';
  document.getElementById('catType').value = 'expense';
  renderEmojiPick();
  document.getElementById('catModal').style.display = 'flex';
}
function editCat(type, idx) {
  catEditId = { type, idx };
  const cat = cats[type][idx];
  curEmoji = cat.slice(0,2);
  document.getElementById('catModalTitle').textContent = '✏️ 编辑分类';
  document.getElementById('catName').value = cat.slice(2).trim();
  document.getElementById('catType').value = type;
  renderEmojiPick();
  document.getElementById('catModal').style.display = 'flex';
}
function deleteCat(type, idx) {
  if (!confirm('删除分类 "'+cats[type][idx]+'"？')) return;
  cats[type].splice(idx, 1);
  saveCats(); toast('已删除');
}
function closeCatModal() { document.getElementById('catModal').style.display='none'; catEditId=null; }
function saveCat() {
  const name = document.getElementById('catName').value.trim();
  const type = document.getElementById('catType').value;
  if (!name) { toast('请输入分类名称'); return; }
  const full = curEmoji + ' ' + name;
  if (catEditId) {
    cats[catEditId.type][catEditId.idx] = full;
  } else {
    if (cats[type].includes(full)) { toast('分类已存在'); return; }
    cats[type].push(full);
  }
  saveCats(); closeCatModal(); toast('已保存 ✓');
}
function renderEmojiPick() {
  const el = document.getElementById('emojiPick');
  el.innerHTML = EMOJIS.map(e => `<button class="${e===curEmoji?'sel':''}" onclick="curEmoji='${e}';renderEmojiPick()">${e}</button>`).join('');
}

// ===== 导出/导入 =====
function exportCSV() {
  if(!records.length){toast('无数据');return;}
  const bom='﻿'; const csv=bom+'日期,类型,分类,金额,备注\n'+records.map(r=>`${r.date},${r.type==='income'?'收入':'支出'},"${r.category}",${r.amount},"${r.note.replace(/"/g,'""')}"`).join('\n');
  download(csv,'账本_'+cmonth+'.csv','text/csv;charset=utf-8'); toast('导出成功 ✓');
}
function exportJSON() {
  if(!records.length){toast('无数据');return;}
  download(JSON.stringify({records,cats,budgets:JSON.parse(localStorage.getItem(BK)||'{}')},null,2),'账本备份_'+cmonth+'.json','application/json'); toast('备份成功 ✓');
}
function download(content, filename, mime) {
  const b=new Blob([content],{type:mime}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=filename; a.click(); URL.revokeObjectURL(u);
}
function importData(e) {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      const recs = data.records || data;
      if(!Array.isArray(recs)) throw new Error('fmt');
      recs.forEach(r=>{if(!r.id||!r.type||!r.amount||!r.date) throw new Error('field');});
      const seen=new Set(); const dedup=[];
      [...recs,...records].forEach(r=>{if(!seen.has(r.id)){seen.add(r.id);dedup.push(r);}});
      dedup.sort((a,b)=>new Date(b.date)-new Date(a.date));
      records=dedup;
      if(data.cats) cats=data.cats;
      if(data.budgets) localStorage.setItem(BK, JSON.stringify(data.budgets));
      save(); saveCats(); load(); refresh(); toast('导入成功 ✓ ('+recs.length+'条)');
    } catch(err){ toast('导入失败：格式不正确'); }
  };
  r.readAsText(f); e.target.value='';
}

// ===== Toast =====
function toast(msg) {
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';},1300);
  setTimeout(()=>el.remove(),1600);
}

// ===== 刷新 =====
function refresh() { renderSummary(); updateBudget(); renderRecords(); }
function tick() {
  const n=new Date();
  const w=['日','一','二','三','四','五','六'];
  document.getElementById('todayStr').textContent = n.getFullYear()+'/'+(n.getMonth()+1)+'/'+n.getDate()+' 周'+w[n.getDay()];
}

// ===== 初始化 =====
function init() {
  document.getElementById('fdate').value = new Date().toISOString().split('T')[0];
  tick(); setInterval(tick, 60000);
  load(); setType('expense'); updateCatSelect(); refresh();
  // 点击空白重置滑动
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.rec-item')) {
      document.querySelectorAll('.rec-item.swiped').forEach(el => el.classList.remove('swiped'));
    }
  });
  // PWA service worker
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE='zb-v3';
      self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['/'])));self.skipWaiting();});
      self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{if(resp.ok){const cl=resp.clone();caches.open(CACHE).then(c=>c.put(e.request,cl));}return resp;})))});
    `;
    const blob = new Blob([swCode], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }
}
init();
</script>
